name: dias-kuzhakhmetov-student-api

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dias-kuzhakhmetov-student-api:v1.0-dias-kuzhakhmetov
    container_name: dias-kuzhakhmetov-student-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studentdb
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_submission}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student-network

  postgres:
    image: postgres:16-alpine
    container_name: dias-kuzhakhmetov-postgres
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_submission}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d studentdb"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - student-network

volumes:
  postgres-data:

networks:
  student-network:
    driver: bridge

